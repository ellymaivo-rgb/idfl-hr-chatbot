<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trợ lý Nhân sự IDFL</title>
  <meta name="description" content="Trợ lý AI hỏi đáp chính sách nhân sự IDFL Việt Nam" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow"></div>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></svg>
        </div>
        <div>
          <h1 id="title" data-i18n="title"></h1>
          <p class="subtitle" data-i18n="subtitle"></p>
        </div>
      </div>
      <div class="actions">
        <div class="lang-switch" role="radiogroup" aria-label="Language">
          <button type="button" role="radio" data-lang="vi" id="lang-vi">VI</button>
          <button type="button" role="radio" data-lang="en" id="lang-en">EN</button>
        </div>
        <button type="button" class="icon-btn" id="theme-btn" data-i18n-title="theme" aria-label="Theme">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button type="button" class="icon-btn" id="new-chat-btn" data-i18n-title="newChat" aria-label="New chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>

    <main class="chat" id="chat">
      <section class="welcome" id="welcome">
        <h2 data-i18n="welcomeTitle"></h2>
        <p data-i18n="welcomeText"></p>
        <div class="suggestions" id="suggestions"></div>
      </section>
      <div class="messages" id="messages" aria-live="polite"></div>
    </main>

    <footer class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" maxlength="2000" data-i18n-placeholder="placeholder"></textarea>
        <button type="submit" id="send-btn" class="send-btn" data-i18n-title="send" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </form>
      <p class="disclaimer" data-i18n="disclaimer"></p>
    </footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
